{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Order</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            width: 400px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        form:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        form p {
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #555;
            background: #f1f1f1;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        a:hover {
            background: #ddd;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <h2>Update Order #{{ order.id }}</h2>
        {{ form.as_p }}
        <div class="button-group">
            <button type="submit">💾 Save Changes</button>
            <a href="{% url 'order_list' %}">✖ Cancel</a>
        </div>
    </form>
</body>
</html>
