{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url("{% static '/image/oo.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            backdrop-filter: blur(5px);
            padding: 35px 40px;
            border-radius: 25px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.25);
            width: 360px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .form-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 35px rgba(0,0,0,0.3);
        }

        h1 {
            color: #000000;
            font-size: 24px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 14px;
            color: #000000;
            text-align: left;
            margin-bottom: 3px;
        }

        input, select {
            padding: 10px 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.3);
            color: #000;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #8fb1ff;
            box-shadow: 0 0 6px rgba(85, 99, 222, 0.5);
            outline: none;
        }

        button {
            background-color: rgba(88, 142, 235, 0.9);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(85, 99, 222, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }
        a {
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            
        }
        a:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Order Form</h1>
        <form method="POST">
            {% csrf_token %}
            {{ vv.as_p }}
            <button type="submit">Submit</button>
        </form>
        <a href="{% url 'order_list' %}">Odered List</a>
    </div>
</body>
</html>
