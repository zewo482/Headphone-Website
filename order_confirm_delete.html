{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cancel Order</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url("{% static '/image/hii.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #fff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #d9534f;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button, a {
            width: 160px;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .confirm {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.4);
        }

        .confirm:hover {
            background: #b02a37;
            transform: scale(1.05);
        }

        .cancel {
            background: #6c757d;
            color: white;
            box-shadow: 0 4px 10px rgba(108, 117, 125, 0.3);
        }

        .cancel:hover {
            background: #565e64;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Cancel Order {{ order.id }}</h2>
        <p>Are you sure you want to Cancel this order? This action cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="confirm">🗑 Yes, Cancel</button>
            <a href="{% url 'order_list' %}" class="cancel">↩ Back</a>
        </form>
    </div>
</body>
</html>
